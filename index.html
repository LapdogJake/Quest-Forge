<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quest-Forge | Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --primary: #8b5cf6;
      --text: #ffffff;
      --text-muted: #a1a1aa;
      --border: #27272a;
      --gold: #eab308;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      padding-bottom: 80px;
    }
    header {
      padding: 16px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .container { padding: 16px; max-width: 480px; margin: 0 auto; }
    
    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .item-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 12px;
    }
    .item-card {
      background: #27272a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item-info h4 { font-size: 16px; color: var(--text); }
    .item-info p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .item-badge {
      background: var(--primary);
      color: white;
      font-weight: bold;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .price-badge {
      background: #222012;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-weight: bold;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
    .btn-danger { background: #ef4444; color: white; margin-top: 20px; }
    .btn-buy {
      background: var(--gold);
      color: #000;
      padding: 8px 16px;
      width: auto;
      font-size: 14px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-buy:disabled {
      background: #4b5563;
      color: #9ca3af;
      cursor: not-allowed;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      height: 65px;
      background: var(--card-bg);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid var(--border);
      z-index: 100;
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: 1;
      padding: 8px 0;
    }
    .nav-btn.active { color: var(--primary); }

    .hidden { display: none !important; }
    .empty-state { text-align: center; color: var(--text-muted); padding: 20px; font-size: 14px; }
  </style>
</head>
<body>

  <header>
    <h1>Quest-Forge</h1>
  </header>

  <main class="container">

    <!-- 1. PROFILE TAB -->
    <section id="tab-profile" class="tab-view">
      <div class="card">
        <h2>Player Profile</h2>
        <p id="user-display" style="margin-top:8px; font-weight: bold; color: var(--primary); font-size: 20px;">Loading...</p>
        
        <div style="margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div style="background:#27272a; padding:12px; border-radius:8px; text-align:center;">
            <small style="color:var(--text-muted)">Gold</small>
            <p id="profile-gold" style="font-size:22px; font-weight:bold; color:var(--gold);">0</p>
          </div>
          <div style="background:#27272a; padding:12px; border-radius:8px; text-align:center;">
            <small style="color:var(--text-muted)">Quest Points</small>
            <p id="profile-qp" style="font-size:22px; font-weight:bold;">0</p>
          </div>
        </div>

        <button class="btn btn-danger" onclick="handleSignOut()">Sign Out</button>
      </div>
    </section>

    <!-- 2. INVENTORY TAB -->
    <section id="tab-inventory" class="tab-view hidden">
      <div class="card">
        <h2>Your Pouch</h2>
        <p style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">Items carried into battle</p>

        <div class="item-grid" id="inventory-list">
          <p class="empty-state">Loading your pouch...</p>
        </div>
      </div>
    </section>

    <!-- 3. SHOP TAB -->
    <section id="tab-shop" class="tab-view hidden">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h2>Park Shop</h2>
          <span class="price-badge">🪙 <span id="shop-gold-display">0</span> Gold</span>
        </div>
        <p style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">Available items from the Questmaster</p>

        <div class="item-grid" id="shop-list">
          <p class="empty-state">Loading market items...</p>
        </div>
      </div>
    </section>

  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-profile" onclick="switchTab('profile')">
      👤 <span>Profile</span>
    </button>
    <button class="nav-btn" id="nav-inventory" onclick="switchTab('inventory')">
      🎒 <span>Inventory</span>
    </button>
    <button class="nav-btn" id="nav-shop" onclick="switchTab('shop')">
      🪙 <span>Shop</span>
    </button>
  </nav>

  <script>
    const SUPABASE_URL = "https://evsknkezkbramsnzisvn.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_3f9t-xXsEqWntgPm9fz-ow_m7fMVt5b";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let currentGold = 0;

    function switchTab(tabName) {
      document.querySelectorAll('.tab-view').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
      document.getElementById(`nav-${tabName}`).classList.add('active');
    }

    async function initDashboard() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      if (!session) {
        window.location.href = "login.html";
        return;
      }

      currentUser = session.user;

      // 1. Fetch Profile
      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('*')
        .eq('id', currentUser.id)
        .single();

      const displayName = profile?.username || currentUser.user_metadata?.username || currentUser.email;
      currentGold = profile?.gold || 0;

      document.getElementById('user-display').innerText = displayName;
      document.getElementById('profile-gold').innerText = currentGold;
      document.getElementById('shop-gold-display').innerText = currentGold;
      document.getElementById('profile-qp').innerText = profile?.quest_points || 0;

      // 2. Fetch Shop & Inventory
      fetchShopItems();
      fetchUserInventory();
    }

    // Fetch Shop Items from Supabase
    async function fetchShopItems() {
      const shopContainer = document.getElementById('shop-list');
      const { data: items, error } = await supabaseClient
        .from('shop_items')
        .select('*')
        .order('price', { ascending: true });

      if (error || !items || items.length === 0) {
        shopContainer.innerHTML = `<p class="empty-state">No items currently available in the shop.</p>`;
        return;
      }

      shopContainer.innerHTML = items.map(item => `
        <div class="item-card">
          <div class="item-info">
            <h4>${item.name}</h4>
            <p>${item.description || ''}</p>
            <span style="color:var(--gold); font-weight:bold; font-size:13px; display:inline-block; margin-top:4px;">
              🪙 ${item.price} Gold
            </span>
          </div>
          <button class="btn-buy" ${currentGold < item.price ? 'disabled' : ''} 
            onclick="buyItem('${item.id}', '${escapeQuotes(item.name)}', '${escapeQuotes(item.description || '')}', ${item.price})">
            ${currentGold < item.price ? 'Need Gold' : 'Buy'}
          </button>
        </div>
      `).join('');
    }

    // Fetch User Inventory from Supabase
    async function fetchUserInventory() {
      const invContainer = document.getElementById('inventory-list');
      const { data: inventory, error } = await supabaseClient
        .from('user_inventory')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false });

      if (error || !inventory || inventory.length === 0) {
        invContainer.innerHTML = `<p class="empty-state">Your pouch is currently empty. Buy items from the Park Shop!</p>`;
        return;
      }

      invContainer.innerHTML = inventory.map(item => `
        <div class="item-card">
          <div class="item-info">
            <h4>${item.item_name}</h4>
            <p>${item.description || ''}</p>
          </div>
          <span class="item-badge">x${item.quantity}</span>
        </div>
      `).join('');
    }

    // Handle Item Purchases
    async function buyItem(itemId, name, description, price) {
      if (currentGold < price) {
        alert("You don't have enough Gold for this!");
        return;
      }

      const newGold = currentGold - price;

      // A. Deduct Gold from Profile
      const { error: profileError } = await supabaseClient
        .from('profiles')
        .update({ gold: newGold })
        .eq('id', currentUser.id);

      if (profileError) {
        alert("Failed to update gold: " + profileError.message);
        return;
      }

      // B. Check if user already owns this item
      const { data: existingItem } = await supabaseClient
        .from('user_inventory')
        .select('*')
        .eq('user_id', currentUser.id)
        .eq('item_name', name)
        .maybeSingle();

      if (existingItem) {
        // Increment quantity
        await supabaseClient
          .from('user_inventory')
          .update({ quantity: existingItem.quantity + 1 })
          .eq('id', existingItem.id);
      } else {
        // Add new item to pouch
        await supabaseClient
          .from('user_inventory')
          .insert({
            user_id: currentUser.id,
            item_name: name,
            description: description,
            quantity: 1
          });
      }

      // C. Refresh UI
      initDashboard();
    }

    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    async function handleSignOut() {
      await supabaseClient.auth.signOut();
      window.location.href = "login.html";
    }

    initDashboard();
  </script>
</body>
</html>
