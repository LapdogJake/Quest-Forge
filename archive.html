<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest &amp; Battle Archive — Quest-Forge</title>
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('qf_theme_mode');
        if (savedTheme === 'light') document.documentElement.classList.add('light-mode');
        var savedTextSize = localStorage.getItem('qf_text_size');
        if (savedTextSize === 'large') document.documentElement.classList.add('large-text');
      } catch (_) {}
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="styles.css?v=30">
  <style>
    body {
      padding-bottom: 40px;
    }

    .archive-shell {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    .archive-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 20px;
    }

    .archive-title-group h1 {
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
      margin: 0 0 4px 0;
    }

    .archive-title-group p {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0;
    }

    .archive-toolbar {
      background: #1e1e22;
      border: 1px solid var(--border);
      border-top: 4px solid #3f3f46;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .archive-filter-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    @media (max-width: 860px) {
      .archive-filter-grid {
        grid-template-columns: 1fr 1fr;
      }
      .archive-search-col {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 520px) {
      .archive-filter-grid {
        grid-template-columns: 1fr;
      }
    }

    .archive-filter-field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .archive-results-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .archive-cards-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    @media (max-width: 780px) {
      .archive-cards-grid {
        grid-template-columns: 1fr;
      }
    }

    .archive-item-card {
      background: #1e1e22;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .archive-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .archive-card-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      margin: 0;
      line-height: 1.3;
    }

    .archive-origin-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      font-size: 12px;
      color: var(--text-muted);
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .archive-origin-row strong {
      color: var(--text);
    }

    .archive-desc {
      font-size: 13px;
      color: var(--text);
      line-height: 1.5;
      white-space: pre-wrap;
      margin: 0;
    }

    .archive-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    html.light-mode .archive-toolbar,
    html.light-mode .archive-item-card {
      background: #ffffff !important;
      border-color: var(--border) !important;
    }

    html.light-mode .archive-origin-row {
      background: #f8fafc !important;
      border-color: var(--border) !important;
    }
  </style>
</head>

<body>
  <main class="archive-shell">
    <!-- Top Header -->
    <div class="archive-topbar">
      <div class="archive-title-group">
        <h1>📚 Quest &amp; Battle Archive</h1>
        <p id="archive-active-realm-banner">Loading active realm...</p>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <a href="index.html" class="btn-secondary" style="text-decoration:none; padding:9px 14px; font-size:13px; font-weight:700; border-radius:8px; display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border);">
          ← Back to Dashboard
        </a>
      </div>
    </div>

    <!-- Search & Filter Toolbar (Creator, Park, Kingdom) -->
    <div class="archive-toolbar">
      <div class="archive-filter-grid">
        <div class="archive-filter-field archive-search-col">
          <label for="archive-search-input">Search Title, Creator, Park, or Kingdom</label>
          <input type="text" id="archive-search-input" class="form-control" placeholder="Search quests, battles, creator QM, park..." oninput="renderArchiveCatalog()">
        </div>

        <div class="archive-filter-field">
          <label for="archive-kingdom-filter">Kingdom</label>
          <select id="archive-kingdom-filter" class="form-control" onchange="onArchiveKingdomFilterChange()">
            <option value="">All Kingdoms</option>
          </select>
        </div>

        <div class="archive-filter-field">
          <label for="archive-park-filter">Park</label>
          <select id="archive-park-filter" class="form-control" onchange="onArchiveParkFilterChange()">
            <option value="">All Parks</option>
          </select>
        </div>

        <div class="archive-filter-field">
          <label for="archive-creator-filter">Creator (QM)</label>
          <select id="archive-creator-filter" class="form-control" onchange="renderArchiveCatalog()">
            <option value="">All Creators</option>
          </select>
        </div>

        <div>
          <button type="button" class="btn-secondary" style="height:40px; padding:0 14px; font-size:12px; font-weight:700; border-radius:8px; border:1px solid var(--border);" onclick="resetArchiveFilters()">
            Reset
          </button>
        </div>
      </div>
    </div>

    <!-- Results Counter -->
    <div class="archive-results-meta">
      <span id="archive-results-count">Loading archive...</span>
    </div>

    <!-- Archive Repository Grid -->
    <div id="archive-cards-container" class="archive-cards-grid">
      <p class="empty-state" style="grid-column: 1 / -1;">Loading archived quests &amp; battles...</p>
    </div>
  </main>

  <script src="js/core/config.js?v=33"></script>
  <script src="js/core/state.js?v=30"></script>
  <script src="js/core/utils.js?v=49"></script>
  <script src="js/core/reigns.js?v=36"></script>
  <script src="js/quests/quests.js?v=37"></script>
  <script src="js/archive/archive.js?v=1"></script>
</body>

</html>
