<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quest-Forge | Reset Password</title>
  <script>
    (function () {
      var hash = window.location.hash || '';
      var search = window.location.search || '';
      var params = new URLSearchParams(hash.startsWith('#') ? hash.substring(1) : hash);
      var sParams = new URLSearchParams(search);
      var err = params.get('error_description') || sParams.get('error_description') || params.get('error') || sParams.get('error');
      if (err) {
        window.__EARLY_RECOVERY_ERROR = decodeURIComponent(err.replace(/\+/g, ' '));
      }
      if (params.get('type') === 'recovery' || sParams.get('type') === 'recovery' || hash.includes('type=recovery') || search.includes('type=recovery')) {
        window.__EARLY_RECOVERY_DETECTED = true;
      }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #141416;
      --card-bg: #1e1e22;
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --text: #ffffff;
      --text-muted: #a1a1aa;
      --border: #27272a;
      --gold: #eab308;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    header h1 {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #c084fc 0%, #a855f7 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .container {
      padding: 16px;
      max-width: 440px;
      margin: 20px auto;
      width: 100%;
      flex: 1;
    }
    .card {
      background: var(--card-bg);
      padding: 24px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .field-group { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    input, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #3f3f46;
      background: #27272a;
      color: white;
      font-size: 15px;
      font-family: inherit;
    }
    input:focus { border-color: var(--primary); outline: none; }
    .toggle-pw-btn {
      position: absolute;
      right: 10px;
      background: none !important;
      border: none !important;
      color: var(--text-muted);
      cursor: pointer;
      width: auto !important;
      padding: 4px !important;
      margin: 0 !important;
      font-size: 14px;
      line-height: 1;
    }
    .toggle-pw-btn:hover { color: white; }
    button[type="submit"], .btn-primary {
      background: var(--primary);
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s ease;
      text-align: center;
      display: block;
      text-decoration: none;
    }
    button[type="submit"]:hover, .btn-primary:hover {
      background: var(--primary-hover);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .link-text {
      margin-top: 16px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }
    .link-text a {
      color: #c084fc;
      font-weight: bold;
      text-decoration: none;
    }
    .link-text a:hover { text-decoration: underline; }
    .status-msg {
      margin-top: 12px;
      font-size: 13px;
      text-align: center;
      line-height: 1.4;
      word-break: break-word;
    }
    .alert-box {
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 1.5;
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header><h1>Quest-Forge</h1></header>

  <main class="container">
    <div class="card">
      
      <!-- 1. Error / Invalid Link State -->
      <div id="error-section" class="hidden">
        <h2 style="margin-bottom: 8px; font-size: 20px; color: #f87171;">⚠️ Reset Link Problem</h2>
        <div class="alert-box alert-error" id="error-message"></div>
        <a href="login.html?forgot=1" class="btn-primary" style="padding: 12px; border-radius: 8px; margin-top: 12px;">Request New Reset Link</a>
        <div class="link-text">
          <a href="login.html">Back to Log In</a>
        </div>
      </div>

      <!-- 2. Loading / Verifying State -->
      <div id="loading-section">
        <h2 style="margin-bottom: 8px; font-size: 20px;">Reset Password</h2>
        <p style="font-size:13px; color:var(--text-muted); margin-bottom:16px;">
          Verifying your password recovery link...
        </p>
        <div class="status-msg" style="color: #c084fc;">⏳ Verifying authorization...</div>
      </div>

      <!-- 3. Password Reset Form -->
      <div id="reset-section" class="hidden">
        <h2 style="margin-bottom: 8px; font-size: 20px;">Choose New Password</h2>
        <p style="font-size:13px; color:var(--text-muted); margin-bottom:16px; line-height:1.4;">
          Please enter your new password below.
        </p>

        <form id="reset-form" onsubmit="handleResetPasswordSubmit(event)">
          <div class="field-group">
            <label for="new-password">New Password</label>
            <div class="input-wrapper">
              <input type="password" id="new-password" placeholder="••••••••" autocomplete="new-password" style="padding-right: 42px;" required minlength="6">
              <button type="button" class="toggle-pw-btn" onclick="togglePasswordVisibility('new-password', this)" title="Show/hide password">👁️</button>
            </div>
          </div>
          <div class="field-group">
            <label for="confirm-password">Confirm New Password</label>
            <div class="input-wrapper">
              <input type="password" id="confirm-password" placeholder="••••••••" autocomplete="new-password" style="padding-right: 42px;" required minlength="6">
              <button type="button" class="toggle-pw-btn" onclick="togglePasswordVisibility('confirm-password', this)" title="Show/hide password">👁️</button>
            </div>
          </div>

          <button type="submit" id="btn-reset">Update Password</button>
          <div id="status" class="status-msg"></div>

          <div class="link-text">
            <a href="login.html">Back to Log In</a>
          </div>
        </form>
      </div>

    </div>
  </main>

  <script src="js/core/config.js?v=30"></script>
  <script>
    let recoverySessionActive = false;

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerText = '🙈';
      } else {
        input.type = 'password';
        btn.innerText = '👁️';
      }
    }

    function showSection(section) {
      document.getElementById('loading-section').classList.add('hidden');
      document.getElementById('error-section').classList.add('hidden');
      document.getElementById('reset-section').classList.add('hidden');

      if (section === 'loading') {
        document.getElementById('loading-section').classList.remove('hidden');
      } else if (section === 'error') {
        document.getElementById('error-section').classList.remove('hidden');
      } else if (section === 'reset') {
        document.getElementById('reset-section').classList.remove('hidden');
      }
    }

    function displayError(message) {
      const errorMsgEl = document.getElementById('error-message');
      if (errorMsgEl) {
        errorMsgEl.innerText = message;
      }
      showSection('error');
    }

    async function initResetFlow() {
      // 1. Check for explicit error parameters in URL hash or search params (e.g. otp_expired)
      const hash = window.location.hash ? window.location.hash.substring(1) : '';
      const hashParams = new URLSearchParams(hash);
      const searchParams = new URLSearchParams(window.location.search);

      const urlError = window.__EARLY_RECOVERY_ERROR ||
                       hashParams.get('error_description') ||
                       searchParams.get('error_description') ||
                       hashParams.get('error') ||
                       searchParams.get('error');

      if (urlError) {
        displayError(decodeURIComponent(urlError.replace(/\+/g, ' ')));
        return;
      }

      // 2. PKCE code parameter exchange (default for modern Supabase auth)
      const code = searchParams.get('code');
      if (code) {
        try {
          const { data, error } = await supabaseClient.auth.exchangeCodeForSession(code);
          if (error) {
            displayError("The password reset link is invalid or has expired: " + error.message);
            return;
          }
          if (data?.session) {
            recoverySessionActive = true;
            try {
              window.history.replaceState({}, document.title, window.location.pathname);
            } catch (_) {}
            showSection('reset');
            return;
          }
        } catch (err) {
          displayError("Failed to verify recovery code: " + err.message);
          return;
        }
      }

      // 3. Check for existing active recovery session or logged-in session
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        recoverySessionActive = true;
        showSection('reset');
        return;
      }

      // 4. Listen for auth state change (e.g. Implicit hash token processing)
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY' || (session && event === 'SIGNED_IN')) {
          recoverySessionActive = true;
          showSection('reset');
        }
      });

      // 5. Fallback timer if hash parsing is asynchronous
      setTimeout(async () => {
        if (!recoverySessionActive) {
          const { data: { session: delayedSession } } = await supabaseClient.auth.getSession();
          if (delayedSession) {
            recoverySessionActive = true;
            showSection('reset');
          } else {
            displayError("No active password recovery session found. Reset links are single-use only. Please request a new link.");
          }
        }
      }, 1000);
    }

    async function handleResetPasswordSubmit(event) {
      if (event) event.preventDefault();
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const status = document.getElementById('status');
      const btn = document.getElementById('btn-reset');

      if (!newPassword || !confirmPassword) {
        status.style.color = "#f87171";
        status.innerText = "Please fill in both password fields.";
        return;
      }

      if (newPassword.length < 6) {
        status.style.color = "#f87171";
        status.innerText = "Password must be at least 6 characters long.";
        return;
      }

      if (newPassword !== confirmPassword) {
        status.style.color = "#f87171";
        status.innerText = "Passwords do not match.";
        return;
      }

      if (btn) btn.disabled = true;
      status.style.color = "white";
      status.innerText = "Updating password...";

      const { data, error } = await supabaseClient.auth.updateUser({
        password: newPassword
      });

      if (error) {
        status.style.color = "#f87171";
        status.innerText = error.message;
        if (btn) btn.disabled = false;
      } else {
        status.style.color = "#86efac";
        status.innerText = "✨ Password successfully updated! Redirecting to Realm...";
        setTimeout(() => {
          window.location.href = "index.html";
        }, 1500);
      }
    }

    initResetFlow();
  </script>
</body>
</html>
