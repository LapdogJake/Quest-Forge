<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quest-Forge | Reset Password</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg: #141416; --card-bg: #1e1e22; --primary: #8b5cf6; --primary-hover: #7c3aed; --text: #ffffff; --text-muted: #a1a1aa; --border: #27272a; --gold: #eab308; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    header { padding: 16px; background: var(--card-bg); border-bottom: 1px solid var(--border); text-align: center; }
    header h1 { font-size: 22px; font-weight: 800; background: linear-gradient(135deg, #c084fc 0%, #a855f7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .container { padding: 16px; max-width: 440px; margin: 20px auto; width: 100%; flex: 1; }
    .card { background: var(--card-bg); padding: 24px 20px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    .field-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 0.5px; }
    input, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #3f3f46; background: #27272a; color: white; font-size: 15px; font-family: inherit; }
    input:focus { border-color: var(--primary); outline: none; }
    button { background: var(--primary); border: none; font-weight: bold; cursor: pointer; margin-top: 8px; transition: background 0.15s ease; }
    button:hover { background: var(--primary-hover); }
    .link-text { margin-top: 16px; text-align: center; font-size: 13px; color: var(--text-muted); }
    .link-text a { color: #c084fc; font-weight: bold; text-decoration: none; }
    .link-text a:hover { text-decoration: underline; }
    .status-msg { margin-top: 12px; font-size: 13px; text-align: center; line-height: 1.4; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header><h1>Quest-Forge</h1></header>

  <main class="container">
    <div class="card">
      <h2 style="margin-bottom: 8px; font-size: 20px;">Choose New Password</h2>
      <p style="font-size:13px; color:var(--text-muted); margin-bottom:16px; line-height:1.4;">
        Please enter your new password below.
      </p>

      <div class="field-group">
        <label for="new-password">New Password</label>
        <input type="password" id="new-password" placeholder="••••••••" autocomplete="new-password">
      </div>
      <div class="field-group">
        <label for="confirm-password">Confirm New Password</label>
        <input type="password" id="confirm-password" placeholder="••••••••" autocomplete="new-password">
      </div>

      <button id="btn-reset" onclick="handleResetPassword()">Update Password</button>
      <div id="status" class="status-msg"></div>

      <div class="link-text">
        <a href="login.html">Back to Log In</a>
      </div>
    </div>
  </main>

  <script src="js/config.js?v=28"></script>
  <script>
    async function handleResetPassword() {
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const status = document.getElementById('status');
      const btn = document.getElementById('btn-reset');

      if (!newPassword || !confirmPassword) {
        status.style.color = "#f87171";
        status.innerText = "Please fill in both password fields.";
        return;
      }

      if (newPassword.length < 6) {
        status.style.color = "#f87171";
        status.innerText = "Password must be at least 6 characters long.";
        return;
      }

      if (newPassword !== confirmPassword) {
        status.style.color = "#f87171";
        status.innerText = "Passwords do not match.";
        return;
      }

      if (btn) btn.disabled = true;
      status.style.color = "white";
      status.innerText = "Updating password...";

      const { data, error } = await supabaseClient.auth.updateUser({
        password: newPassword
      });

      if (error) {
        status.style.color = "#f87171";
        status.innerText = error.message;
        if (btn) btn.disabled = false;
      } else {
        status.style.color = "#86efac";
        status.innerText = "✨ Password successfully updated! Redirecting to Realm...";
        setTimeout(() => {
          window.location.href = "index.html";
        }, 1500);
      }
    }
  </script>
</body>
</html>
