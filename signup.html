<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quest-Forge | Create Account</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #141416;
      --card-bg: #1e1e22;
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --text: #ffffff;
      --text-muted: #a1a1aa;
      --border: #27272a;
      --gold: #eab308;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    header h1 {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #c084fc 0%, #a855f7 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .container {
      padding: 16px;
      max-width: 480px;
      margin: 20px auto;
      width: 100%;
      flex: 1;
    }
    .card {
      background: var(--card-bg);
      padding: 24px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .field-group { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #3f3f46;
      background: #27272a;
      color: white;
      font-size: 15px;
      font-family: inherit;
    }
    input:focus, select:focus { border-color: var(--primary); outline: none; }
    .toggle-pw-btn {
      position: absolute;
      right: 10px;
      background: none !important;
      border: none !important;
      color: var(--text-muted);
      cursor: pointer;
      width: auto !important;
      padding: 4px !important;
      margin: 0 !important;
      font-size: 14px;
      line-height: 1;
    }
    .toggle-pw-btn:hover { color: white; }
    button[type="submit"] {
      background: var(--primary);
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s ease;
    }
    button[type="submit"]:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .link-text {
      margin-top: 16px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }
    .link-text a {
      color: #c084fc;
      font-weight: bold;
      text-decoration: none;
    }
    .link-text a:hover { text-decoration: underline; }
    .status-msg {
      margin-top: 12px;
      font-size: 13px;
      text-align: center;
      line-height: 1.4;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <header><h1>Quest-Forge</h1></header>

  <main class="container">
    <div class="card">
      <h2 style="margin-bottom: 16px; font-size: 20px;">Create Character</h2>
      
      <form id="signup-form" onsubmit="handleSignUpSubmit(event)">
        <div class="field-group">
          <label for="username">Amtgard Character Name</label>
          <input type="text" id="username" placeholder="e.g. Sir Robin" required>
        </div>
        <div class="field-group">
          <label for="signup-kingdom">Home Kingdom</label>
          <select id="signup-kingdom" onchange="onSignupKingdomChange()">
          </select>
        </div>
        <div class="field-group">
          <label for="signup-park">Home Park</label>
          <select id="signup-park">
          </select>
        </div>
        <div class="field-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="hero@example.com" autocomplete="email" required>
        </div>
        <div class="field-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" placeholder="••••••••" autocomplete="new-password" style="padding-right: 42px;" required minlength="6">
            <button type="button" class="toggle-pw-btn" onclick="togglePasswordVisibility('password', this)" title="Show/hide password">👁️</button>
          </div>
        </div>
        <div class="field-group">
          <label for="confirm-password">Confirm Password</label>
          <div class="input-wrapper">
            <input type="password" id="confirm-password" placeholder="••••••••" autocomplete="new-password" style="padding-right: 42px;" required minlength="6">
            <button type="button" class="toggle-pw-btn" onclick="togglePasswordVisibility('confirm-password', this)" title="Show/hide password">👁️</button>
          </div>
        </div>
        
        <button type="submit" id="btn-signup">Create Account</button>
        <div id="status" class="status-msg"></div>

        <div class="link-text">
          Already have an account? <a href="login.html">Log In</a>
        </div>
      </form>
    </div>
  </main>

  <script src="js/config.js?v=29"></script>
  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerText = '🙈';
      } else {
        input.type = 'password';
        btn.innerText = '👁️';
      }
    }

    function initSignupGroups() {
      const kSelect = document.getElementById('signup-kingdom');
      const pSelect = document.getElementById('signup-park');
      if (!kSelect || !pSelect) return;

      const kingdoms = Object.keys(AMTGARD_KINGDOMS_AND_PARKS);
      kSelect.innerHTML = kingdoms.map(k => `<option value="${k}">${k}</option>`).join('');
      kSelect.value = "The Freeholds of Amtgard";
      onSignupKingdomChange();
    }

    function onSignupKingdomChange() {
      const kSelect = document.getElementById('signup-kingdom');
      const pSelect = document.getElementById('signup-park');
      const parks = AMTGARD_KINGDOMS_AND_PARKS[kSelect.value] || [];
      pSelect.innerHTML = parks.map(p => `<option value="${p}">${p}</option>`).join('');
    }

    initSignupGroups();

    async function handleSignUpSubmit(event) {
      if (event) event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const username = document.getElementById('username').value.trim();
      const kingdom = document.getElementById('signup-kingdom').value;
      const park = document.getElementById('signup-park').value;
      const status = document.getElementById('status');
      const btn = document.getElementById('btn-signup');

      if (!email || !password || !confirmPassword || !username) {
        status.style.color = "#f87171";
        status.innerText = "Please fill in all fields.";
        return;
      }

      if (password.length < 6) {
        status.style.color = "#f87171";
        status.innerText = "Password must be at least 6 characters long.";
        return;
      }

      if (password !== confirmPassword) {
        status.style.color = "#f87171";
        status.innerText = "Passwords do not match. Please verify your password.";
        return;
      }

      if (btn) btn.disabled = true;
      status.style.color = "white";
      status.innerText = "Creating character...";

      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: { 
          data: { 
            username: username,
            kingdom: kingdom,
            park: park
          } 
        }
      });

      if (error) {
        status.style.color = "#f87171";
        if (error.message && error.message.includes("Database error saving new user")) {
          status.innerHTML = `⚠️ <strong>Database Trigger Error:</strong><br>Please run the script in <code>supabase_setup.sql</code> in your Supabase SQL Editor to enable new account creation.`;
        } else {
          status.innerText = error.message;
        }
        if (btn) btn.disabled = false;
        return;
      }

      // Ensure active session via immediate sign in
      let loggedUser = data?.user;
      if (!data?.session) {
        const { data: loginData, error: loginErr } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (loginErr) {
          status.style.color = "#f87171";
          status.innerText = loginErr.message;
          if (btn) btn.disabled = false;
          return;
        }
        loggedUser = loginData?.user;
      }

      if (loggedUser) {
        // Upsert profile and user_park_profile to guarantee character initialization
        await supabaseClient.from('profiles').upsert({
          id: loggedUser.id,
          username: username,
          email: email,
          kingdom: kingdom,
          park: park,
          role: 'player',
          gold: 0
        });

        await supabaseClient.from('user_park_profiles').upsert({
          user_id: loggedUser.id,
          kingdom: kingdom,
          park: park,
          role: 'player',
          gold: 0
        });
      }

      window.location.href = "index.html";
    }
  </script>
</body>
</html>
